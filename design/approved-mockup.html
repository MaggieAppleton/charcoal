<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunburst canvas</title>
<style>
:root{
  --canvas:#ecebe6; --surface:#fff; --ink:#1d1c1a; --muted:#6b6963; --faint:#a3a099;
  --line:rgba(28,26,22,.10); --hover:rgba(28,26,22,.055); --press:rgba(28,26,22,.09);
  --focus:#2f6fe0; --area:#ff5c33; --sketch:#0e8a8c; --style:#8a5a2b;
  --pass:#2e7a4c; --warn:#a96400; --fail:#c2392d; --new:#2f6fe0;
  --shadow-control:0 0 0 .5px rgba(0,0,0,.10),0 1px 1px -1px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
  --shadow-pop:0 0 0 .5px rgba(0,0,0,.09),0 12px 28px -10px rgba(0,0,0,.20),0 1px 2px rgba(0,0,0,.05);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --composer-h:120px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#f8f7f4;color:var(--ink);font:400 14px/22px var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:root:not([data-modality=pointer]) :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}

/* ---------- Simulator chrome (not part of the proposal) ---------- */
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:12px 16px 10px;padding:6px 8px;border:1px dashed #b9b5aa;border-radius:8px;font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:#5b5850}
.sim b{font-weight:600;color:#3d3b36;margin-right:4px}
.sim button{height:24px;padding:0 8px;border:1px solid transparent;border-radius:5px;background:none;font:inherit;color:inherit}
.sim button:hover{border-color:#cfcbc0}
.sim button[aria-pressed=true]{background:#3d3b36;color:#fff}
.sim p{margin:0;flex:1 1 260px;min-width:0;color:#77736a}

/* ---------- Frame ---------- */
.frame{position:relative;margin:0 16px 16px;height:720px;border-radius:12px;overflow:hidden;background:var(--canvas);box-shadow:0 0 0 1px rgba(0,0,0,.07);container-type:inline-size;container-name:frame}
.frame.dropping::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(28,26,22,.25);border-radius:10px;pointer-events:none;z-index:50}

/* Board */
.board{position:absolute;inset:0;overflow:auto;padding:72px 48px calc(var(--composer-h) + 56px);--tile:clamp(108px,15cqw,176px)}
.board-inner{display:flex;align-items:flex-start;gap:clamp(40px,9cqw,120px);width:max-content;margin:0 auto}
.refs{display:flex;gap:10px;align-items:flex-start}
.refs .col{display:flex;flex-direction:column;gap:10px;width:calc(var(--tile) * .7)}
.rows{display:flex;flex-direction:column;gap:44px}
.row{display:flex;gap:6px}
.row .tile{width:var(--tile)}
.tile{position:relative;border-radius:3px;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.tile canvas,.tile img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:#ddd}
.tile.tall canvas,.tile.tall img{aspect-ratio:3/4}
.tile.square canvas,.tile.square img{aspect-ratio:1}
.tile:hover canvas,.tile:hover img{box-shadow:0 0 0 1px rgba(28,26,22,.22)}
.tile:active{transform:scale(.985)}
.tile.sel::before{content:"";position:absolute;inset:-4px;border:2px solid var(--ink);border-radius:6px;pointer-events:none}
.tile.hl::before{content:"";position:absolute;inset:-4px;border:2px solid var(--ink);border-radius:6px;box-shadow:0 0 0 4px rgba(28,26,22,.12);pointer-events:none}
:root:not([data-modality=pointer]) .tile:focus-visible{outline-offset:7px}
.tile .n{position:absolute;left:-10px;top:-10px}
.n{min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:#fff;font:600 12px/20px var(--font);text-align:center;box-shadow:0 0 0 2px var(--canvas);font-variant-numeric:tabular-nums}
.tile .mark{position:absolute;right:4px;bottom:4px;display:grid;place-items:center;width:20px;height:20px;border-radius:10px;background:#fff;color:var(--ink);box-shadow:var(--shadow-control)}
.tile .mark svg{width:14px;height:14px}
.tile .mark.area{color:var(--area)}
.tile .mark.kept{color:var(--pass)}
.tile .dot{position:absolute;right:-4px;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--new);box-shadow:0 0 0 2px var(--canvas)}
.tile.flash{animation:flash .7s ease}
@keyframes flash{0%,100%{transform:none}35%{transform:scale(1.04)}}
.tile.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:scale(.92)}}

/* Context bar attached to the active image */
.tile.active{z-index:7}
.ctx{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);display:flex;gap:2px;padding:2px;background:var(--surface);border-radius:8px;box-shadow:var(--shadow-pop);z-index:6;white-space:nowrap;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-3px)}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:500 13px/20px var(--font);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.lead{padding-left:8px}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn.icon{width:28px;padding:0}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#3b3934}
.btn.primary:disabled{background:#c9c6be;cursor:default}
.btn[aria-pressed=true],.btn[aria-expanded=true]{background:var(--press)}
.btn .muted{color:var(--muted);font-weight:400}
.btn.warn svg{color:var(--warn)}
.btn:disabled{cursor:default}
.muted{color:var(--muted)}
.import{position:absolute;top:16px;right:16px;z-index:5;color:var(--muted)}
.import:hover{color:var(--ink)}

/* Segmented */
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:rgba(28,26,22,.06)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:500 13px/20px var(--font);white-space:nowrap}
.seg button svg{width:16px;height:16px}
.seg button.ico{width:28px;padding:0;justify-content:center}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow-control)}

/* Composer */
.composer{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:var(--surface);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;z-index:20}
:root:not([data-modality=pointer]) .composer:has(textarea:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.composer textarea{display:block;width:100%;min-height:44px;max-height:144px;padding:8px 10px 4px;border:0;resize:none;background:transparent;font:400 14px/22px var(--font)}
.composer textarea::placeholder{color:var(--faint)}
.bar{display:flex;align-items:center;gap:4px;padding:2px}
.bar .spacer{flex:1;min-width:0}
.tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 8px 2px}
.att{position:relative}
.thumb{position:relative;display:block;width:44px;height:32px;padding:0;border:0;border-radius:5px;background:#ddd;overflow:visible}
.thumb canvas{display:block;width:44px;height:32px;border-radius:5px}
.thumb .n{position:absolute;left:-6px;top:-6px;min-width:18px;height:18px;line-height:18px;font-size:11px;padding:0 4px;box-shadow:0 0 0 2px #fff}
.thumb .bm{position:absolute;right:-6px;bottom:-6px;display:grid;place-items:center;width:18px;height:18px;border-radius:9px;background:#fff;color:var(--area);box-shadow:var(--shadow-control)}
.thumb .bm svg{width:12px;height:12px}
.att.hl .thumb canvas{box-shadow:0 0 0 2px var(--ink)}
.att .x{position:absolute;right:-7px;top:-7px;display:grid;place-items:center;width:18px;height:18px;padding:0;border:0;border-radius:9px;background:var(--ink);color:#fff;opacity:0;transition:opacity .12s}
.att .x svg{width:12px;height:12px}
.att:hover .x,.att:focus-within .x{opacity:1}
.att.target .x{right:auto;left:30px}
.limit{font-size:13px;line-height:20px;color:var(--warn)}
.fullprompt{margin:4px 4px 2px;padding:8px 10px;border-radius:10px;background:#f5f4f0;font:400 13px/20px var(--font);max-height:180px;overflow:auto;animation:grow .2s ease-out}
@keyframes grow{from{opacity:0;transform:translateY(4px)}}
.fullprompt p{margin:0 0 6px}
.fullprompt .you{color:var(--ink)}
.fullprompt .img{color:var(--muted)}
.fullprompt .sty{color:var(--style);text-decoration:underline dotted rgba(138,90,43,.45);text-underline-offset:3px}
.fullprompt .after{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:16px}

/* Popovers */
.pop{position:absolute;z-index:30;background:var(--surface);border-radius:10px;box-shadow:var(--shadow-pop);padding:4px;overflow:auto;animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(4px)}}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px;padding:2px 2px 2px 8px;font:500 13px/20px var(--font)}
.srow .lbl{color:var(--muted);font-weight:400}
.pophead{display:flex;align-items:center;gap:6px;padding:2px 2px 4px 2px}
.pophead .spacer{flex:1}
.menu{position:absolute;z-index:35;padding:4px;background:#fff;border-radius:10px;box-shadow:var(--shadow-pop);min-width:180px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border:0;border-radius:6px;background:none;font:500 13px/20px var(--font);text-align:left}
.menu button:hover{background:var(--hover)}
.menu button .chk{width:16px;color:var(--ink)}

/* Rules */
.rule{border-radius:8px}
.rule.open{background:#f7f6f2}
.rrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto 16px;align-items:center;gap:8px;min-height:36px;padding:4px 8px;border-radius:6px}
.rrow:hover{background:var(--hover)}
.rule.open .rrow:hover{background:transparent}
.rrow .open-btn{all:unset;display:contents;cursor:pointer}
.rrow .t{font:500 13px/20px var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.rule.off .t{color:var(--faint)}
.kinds{display:flex;gap:4px;color:var(--faint)}
.kinds span{display:grid;place-items:center;width:20px;height:20px}
.kinds svg{width:14px;height:14px}
.kinds .on{color:var(--muted)}
.chev{color:var(--faint);transition:transform .18s;cursor:pointer}
.chev svg{width:16px;height:16px}
.rule.open .chev{transform:rotate(90deg)}
.check{appearance:none;width:16px;height:16px;margin:2px;border-radius:4px;border:1.5px solid #b8b4aa;background:#fff;display:grid;place-items:center;cursor:pointer}
.check:checked{background:var(--ink);border-color:var(--ink)}
.check:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.rbody{padding:2px 8px 10px 36px;display:grid;gap:10px}
.field-l{display:block;font:500 13px/20px var(--font);color:var(--muted);margin-bottom:2px}
.rbody textarea,.rbody input[type=text],.ovr textarea{display:block;width:100%;padding:6px 8px;border:0;border-radius:8px;background:#fff;box-shadow:var(--shadow-control);font:400 14px/22px var(--font);resize:none}
.rbody textarea::placeholder,.ovr textarea::placeholder{color:var(--faint)}
.exs{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.ex{margin:0;width:88px}
.ex canvas{display:block;width:88px;height:50px;border-radius:4px;object-fit:cover}
.ex figcaption{font:400 12px/16px var(--font);color:var(--muted);margin-top:4px}
.ex figcaption b{display:block;font-weight:500;color:var(--ink)}
.addex{width:88px;height:50px;border-radius:4px;border:1px dashed #c9c5ba;background:none;color:var(--muted);display:grid;place-items:center}
.addex:hover{color:var(--ink);border-color:#9d998f}
.addex svg{width:16px;height:16px}

/* Opened image layer */
.scrim{position:absolute;inset:0;z-index:9;background:rgba(236,235,230,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.focus{position:absolute;left:0;right:0;top:0;bottom:calc(var(--composer-h) + 24px);z-index:10;overflow:auto}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:20px;padding:16px}
.figcol{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.tools{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:4px;background:#fff;border-radius:10px;box-shadow:var(--shadow-pop);animation:fade .25s .1s both}
.tools .sep{width:1px;height:16px;background:var(--line);margin:0 4px}
.tools .size{display:flex;align-items:center;gap:8px;padding:0 6px 0 8px;height:28px;font:500 13px/20px var(--font)}
.tools .size output{min-width:44px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools input[type=range]{width:96px;accent-color:var(--ink)}
.fig{position:relative;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px -16px rgba(0,0,0,.3);transform-origin:0 0;background:#ddd;flex:none}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:4px}
.fig .ov{touch-action:none}
.fig.painting .ov{cursor:none}
.cursor{position:absolute;pointer-events:none;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.35);transform:translate(-50%,-50%)}
.cursor.erase{border-style:dashed}
.readout{margin:0;max-width:640px;min-height:40px;text-align:center;font:400 13px/20px var(--font);color:var(--muted);animation:fade .25s .1s both}
.readout b{font-weight:500;color:var(--ink)}
.readout .k-area{color:var(--area)}
.readout .k-sketch{color:var(--sketch)}

/* Review */
.review{width:320px;flex:none;max-height:100%;overflow:auto;background:#fff;border-radius:12px;box-shadow:var(--shadow-pop);padding:4px;animation:fade .25s .1s both}
.rv-head{padding:8px 8px 6px}
.rv-title{font:500 15px/24px var(--font)}
.link{all:unset;cursor:pointer;color:var(--muted);font:400 13px/20px var(--font);border-radius:4px}
.link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rv-sub{display:flex;gap:8px;padding:12px 8px 2px;font:500 13px/20px var(--font)}
.ck-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto 16px;align-items:center;gap:8px;width:100%;min-height:36px;padding:4px 8px;border:0;border-radius:6px;background:none;text-align:left;font:500 13px/20px var(--font)}
.ck-row:hover{background:var(--hover)}
.ck-row .ico{display:grid;place-items:center;width:20px;height:20px}
.ck-row .ico svg{width:16px;height:16px}
.st-pass{color:var(--pass)} .st-warn{color:var(--warn)} .st-fail{color:var(--fail)}
.ck-word{font-weight:400}
.ck.open .chev{transform:rotate(90deg)}
.ck.open{background:#f7f6f2;border-radius:8px}
.ck.open .ck-row:hover{background:transparent}
.ck-body{padding:0 8px 10px 36px;display:grid;gap:10px}
.ck-body p{margin:0}
.ck-acts{display:flex;gap:4px;margin-left:-10px}
.ovr{display:grid;gap:6px}
.ovr .acts{display:flex;gap:4px}
.note{font-size:13px;line-height:20px;color:var(--muted)}
.rv-foot{display:flex;align-items:center;gap:8px;padding:10px 8px 6px}
.rv-foot .muted{font-size:13px;line-height:20px}

/* Tooltip */
.tip{position:absolute;z-index:60;pointer-events:none;max-width:240px;padding:4px 8px;border-radius:6px;background:var(--ink);color:#fff;font:500 12px/16px var(--font);white-space:nowrap;animation:fade .12s ease-out}

/* Narrow */
@container frame (max-width: 640px){
  .board{padding:60px 16px calc(var(--composer-h) + 72px);--tile:calc((100cqw - 32px - 12px) / 3)}
  .board-inner{flex-direction:column;gap:36px;width:auto}
  .refs .col{width:calc((100cqw - 32px - 6px) / 2)}
  .rows{gap:28px}
  .row{flex-wrap:wrap}
  .stage{flex-direction:column;justify-content:flex-start;padding:12px}
  .review{width:100%;max-height:none}
  .tools input[type=range]{width:72px}
  #setSummary,.tools .size .muted{display:none}
  .refs .col{width:calc((100cqw - 32px - 10px) / 2)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="sim" role="group" aria-label="Mockup states">
  <b>Mockup</b>
  <button type="button" data-state="board" aria-pressed="true">Board</button>
  <button type="button" data-state="attached">Images attached</button>
  <button type="button" data-state="edit">Edit area</button>
  <button type="button" data-state="style">Style</button>
  <button type="button" data-state="review">Review</button>
  <p id="simNote" aria-live="polite"></p>
</div>

<div class="frame" id="frame">
  <div class="board" id="board" aria-label="Canvas">
    <div class="board-inner">
      <div class="refs" aria-label="References"><div class="col" id="colA"></div><div class="col" id="colB"></div></div>
      <div class="rows">
        <div class="row" id="rowStream" aria-label="Stream crossing variations"></div>
        <div class="row" id="rowHill" aria-label="Hill path variations"></div>
      </div>
    </div>
  </div>

  <button class="btn lead import" id="importBtn" type="button" data-icon="upload" data-tip="Or drop images anywhere">Import</button>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="scrim" id="scrim" hidden></div>
  <div class="focus" id="focus" hidden>
    <div class="stage" id="stage">
      <div class="figcol">
        <div class="tools" id="editTools" role="toolbar" aria-label="Edit area tools">
          <div class="seg" role="radiogroup" aria-label="Layer">
            <button type="button" role="radio" data-layer="area" aria-checked="true" data-icon="brush" data-tip="Paint where the image may change (A)">Edit area</button>
            <button type="button" role="radio" data-layer="sketch" aria-checked="false" data-icon="pen" data-tip="Draw guide lines on top (S)">Sketch</button>
          </div>
          <div class="seg" role="radiogroup" aria-label="Tool">
            <button type="button" class="ico" role="radio" data-erase="0" aria-checked="true" aria-label="Paint" data-icon="circleDot" data-tip="Paint (B)"></button>
            <button type="button" class="ico" role="radio" data-erase="1" aria-checked="false" aria-label="Erase" data-icon="eraser" data-tip="Erase (E)"></button>
          </div>
          <label class="size"><span class="muted">Size</span><input type="range" id="size" min="12" max="240" step="2" value="96" aria-label="Brush size"><output id="sizeOut">96 px</output></label>
          <span class="sep"></span>
          <button type="button" class="btn icon" id="undo" aria-label="Undo" data-icon="undo" data-tip="Undo (⌘Z)"></button>
          <button type="button" class="btn icon" id="clear" aria-label="Clear this layer" data-icon="trash" data-tip="Clear layer"></button>
          <button type="button" class="btn icon" id="eye" aria-label="Hide overlay" aria-pressed="false" data-icon="eye" data-tip="Hide overlay"></button>
          <span class="sep"></span>
          <button type="button" class="btn primary" id="done">Done</button>
        </div>
        <div class="tools" id="reviewTools" role="toolbar" aria-label="Compare" hidden>
          <div class="seg" role="radiogroup" aria-label="Show">
            <button type="button" role="radio" data-show="result" aria-checked="true">Result</button>
            <button type="button" role="radio" data-show="source" aria-checked="false">Source</button>
          </div>
          <button type="button" class="btn lead" id="areaToggle" aria-pressed="true" data-icon="brush">Edit area</button>
          <span class="sep"></span>
          <button type="button" class="btn icon" id="closeReview" aria-label="Close" data-icon="x" data-tip="Close (Esc)"></button>
        </div>
        <div class="fig" id="fig">
          <canvas id="figArt" aria-hidden="true"></canvas>
          <canvas id="figAlt" aria-hidden="true" hidden></canvas>
          <canvas class="ov" id="ov" role="img" aria-label="Painting surface"></canvas>
          <div class="cursor" id="cursor" hidden></div>
        </div>
        <p class="readout" id="readout" aria-live="polite"></p>
      </div>
      <aside class="review" id="reviewPanel" aria-label="Review" hidden></aside>
    </div>
  </div>

  <div class="composer" id="composer">
    <div class="fullprompt" id="fullPrompt" hidden aria-label="Full prompt"></div>
    <div class="tray" id="tray" hidden></div>
    <textarea id="prompt" rows="1" aria-label="Prompt" placeholder="Describe an illustration"></textarea>
    <div class="bar">
      <button type="button" class="btn lead" id="styleBtn" aria-haspopup="dialog" aria-expanded="false" data-icon="palette"><span id="styleName">Field notes</span></button>
      <button type="button" class="btn lead" id="setBtn" aria-haspopup="dialog" aria-expanded="false" data-icon="sliders">Sunburst 2.6 <span class="muted" id="setSummary">Medium</span></button>
      <button type="button" class="btn icon" id="fpBtn" aria-expanded="false" aria-controls="fullPrompt" aria-label="Full prompt" data-icon="doc" data-tip="Full prompt"></button>
      <span class="spacer"></span>

function drawCover(ctx, src, W, H) {
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;

const ITEMS = {

const BLOB = (() => { const pts = []; for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2; const k = 1 + .13 * Math.sin(3 * a + .6) + .07 * Math.cos(5 * a); pts.push([.78 + .17 * k * Math.cos(a), .27 + .23 * k * Math.sin(a)]); } return { layer: 'area', fill: true, pts }; })();

/* ---------- Board ---------- */
function makeTile(id) {

}
function updateCursorSize() {
  const w = fig.clientWidth; const px = S.tool.size[S.tool.layer] / 1536 * w;
  const d = Math.max(px, 6); cursor.style.width = cursor.style.height = d + 'px';
}
$('#editTools').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.layer) S.tool.layer = b.dataset.layer;
  if (b.dataset.erase) S.tool.erase = b.dataset.erase === '1';
  if (b.id === 'undo') undo();
  if (b.id === 'clear') clearLayer();
  if (b.id === 'eye') { S.showOverlay = !S.showOverlay; renderOverlay(); }
  if (b.id === 'done') { closeLayer(); return; }
  renderTools();
});
$('#size').addEventListener('input', e => { S.tool.size[S.tool.layer] = +e.target.value; renderTools(); });
function snapshot() { const s = S.strokes[S.focusId]; s.undo.push(s.list.slice()); if (s.undo.length > 60) s.undo.shift(); }
function undo() { const s = S.strokes[S.focusId]; if (!s.undo.length) return; s.list = s.undo.pop(); after(); }
function clearLayer() { const s = S.strokes[S.focusId]; if (!s.list.some(x => x.layer === S.tool.layer)) return; snapshot(); s.list = s.list.filter(x => x.layer !== S.tool.layer); after(); }
function after() { renderOverlay(); renderReadout(); renderTools(); renderTiles(); renderTray(); renderComposer(); renderFullPrompt(); }

let drawing = null;
const norm = e => { const r = ov.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
ov.addEventListener('pointerdown', e => {
  if (S.mode !== 'edit' || e.button !== 0) return;
  e.preventDefault(); ov.setPointerCapture(e.pointerId);
  if (!S.showOverlay) { S.showOverlay = true; renderTools(); }
  snapshot();
  drawing = { layer: S.tool.layer, erase: S.tool.erase, size: S.tool.size[S.tool.layer] / 1536, pts: [norm(e)] };
  S.strokes[S.focusId].list.push(drawing); renderOverlay();
});
ov.addEventListener('pointermove', e => {
  if (S.mode !== 'edit') return;
  const r = fig.getBoundingClientRect();
  cursor.hidden = false; cursor.style.left = (e.clientX - r.left) + 'px'; cursor.style.top = (e.clientY - r.top) + 'px';
  if (!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) drawing.pts.push(norm(ev));
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderOverlay(); });
});
const endStroke = () => { if (!drawing) return; drawing = null; after(); };
ov.addEventListener('pointerup', endStroke); ov.addEventListener('pointercancel', endStroke);
ov.addEventListener('pointerleave', () => { if (!drawing) cursor.hidden = true; });

/* Review */
function openReview(id) {
  S.seen.add(id); checksFor();
  S.showSource = false; S.openCheck = null;
  showLayer(id, 'review');
  paintFigure(figAlt, ITEMS[id].from);
  renderReviewTools(); renderReview(); renderReadout(); layoutFocus();
  $('#reviewPanel .ck-row')?.focus({ preventScroll: true });
}
function statusIcon(c) { const s = c.override ? 'pass' : c.status; return `<span class="ico st-${s}">${ic(s === 'pass' ? 'checkCircle' : s === 'warn' ? 'alertCircle' : 'xCircle')}</span>`; }
function statusWord(c) { if (c.override) return `<span class="ck-word st-pass">Fine</span>`; return `<span class="ck-word st-${c.status}">${c.word || { pass: 'Passed', warn: 'Look again', fail: 'Failed' }[c.status]}</span>`; }
function renderReview() {
  const R = checksFor(), kept = S.kept.has('s5');
  const row = (c, id) => {
    const open = S.openCheck === id;
    return `<div class="ck${open ? ' open' : ''}" data-ck="${id}">
      <button type="button" class="ck-row" aria-expanded="${open}">${statusIcon(c)}<span>${c.title}</span>${statusWord(c)}<span class="chev" style="display:grid;place-items:center;color:var(--faint);transition:transform .18s">${ic('chevRight')}</span></button>
      ${open ? `<div class="ck-body">
        <p>${c.obs}</p>
        ${c.override ? `<p class="note">Your call: ${esc(c.override)}</p>` : ''}
        ${c.ev ? `<div class="exs">${evidenceHTML(c)}</div>` : ''}
        ${c.status !== 'pass' && !c.override ? `<div class="ck-acts" data-acts><button type="button" class="btn" data-act="revise">Revise</button><button type="button" class="btn" data-act="fine">It's fine</button></div>
        <div class="ovr" hidden><textarea rows="2" aria-label="Why it works" placeholder="Why it works"></textarea><div class="acts"><button type="button" class="btn primary" data-act="save">Save</button><button type="button" class="btn" data-act="cancel">Cancel</button></div></div>` : ''}
      </div>` : ''}
    </div>`;
  };
  $('#reviewPanel').innerHTML = `
    <div class="rv-head"><div class="rv-title">${nameOf('s5')}</div><button type="button" class="link" id="srcLink">Edited from ${nameOf('s1')}</button></div>
    ${row(R.pixel, 'pixel')}
    <div class="rv-sub">${S.style.name}<span class="muted" style="font-weight:400">Version 3</span></div>
    ${R.list.map(c => row(c, c.id)).join('')}
    <div class="rv-foot">${kept ? `<button type="button" class="btn lead" disabled>${ic('check')}Kept</button>` : `<button type="button" class="btn primary" id="keepBtn">Keep</button>`}
      <span class="muted">${openCount() ? `${openCount()} to look at` : 'All checks passed'}</span></div>`;
  $$('#reviewPanel canvas[data-ev]').forEach(drawEvidence);
}
function evidenceHTML(c) {
  if (c.ev === 'compare') return `<figure class="ex"><canvas width="176" height="100" data-ev="like"></canvas><figcaption><b>Like this</b>${nameOf('s2')}</figcaption></figure><figure class="ex"><canvas width="176" height="100" data-ev="crop"></canvas><figcaption><b>This result</b>Same area</figcaption></figure>`;
  return `<figure class="ex"><canvas width="176" height="100" data-ev="tsrc"></canvas><figcaption><b>Before</b>Thumbnail size</figcaption></figure><figure class="ex"><canvas width="176" height="100" data-ev="tres"></canvas><figcaption><b>This result</b>Thumbnail size</figcaption></figure>`;
}
const hi = {};
function hiRes(id) { if (!hi[id]) { hi[id] = document.createElement('canvas'); paint(hi[id], ITEMS[id].art, 3); } return hi[id]; }
function drawEvidence(cv) {
  const x = cv.getContext('2d'), k = cv.dataset.ev, crop = [.58, .02, .4, .5];
  const cropDraw = src => { const [a, b, w, h] = crop; x.drawImage(src, a * MW, b * MH, w * MW, h * MH, 0, 0, 176, 100); };
  if (k === 'like') cropDraw(hiRes('s2'));
  if (k === 'crop') cropDraw(hiRes('s5'));
  if (k === 'tsrc' || k === 'tres') { x.imageSmoothingQuality = 'high'; x.drawImage(hiRes(k === 'tsrc' ? 's1' : 's5'), 0, 0, 176, 99); }
}
$('#reviewPanel').addEventListener('click', e => {
  const t = e.target, R = checksFor();
  if (t.closest('#srcLink')) { S.showSource = !S.showSource; renderReviewTools(); return; }
  if (t.closest('#keepBtn')) { S.kept.add('s5'); renderReview(); renderTiles(); $('#reviewPanel .rv-foot button').focus(); note('Kept. In the build this marks Stream crossing 5 as approved for export.'); return; }
  const ck = t.closest('.ck'); if (!ck) return;
  const id = ck.dataset.ck, c = id === 'pixel' ? R.pixel : R.list.find(x => x.id === id);
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'fine') { $('[data-acts]', ck).hidden = true; $('.ovr', ck).hidden = false; $('.ovr textarea', ck).focus(); return; }
  if (act === 'cancel') { $('[data-acts]', ck).hidden = false; $('.ovr', ck).hidden = true; $('[data-act=fine]', ck).focus(); return; }
  if (act === 'save') { const v = $('.ovr textarea', ck).value.trim(); if (!v) { $('.ovr textarea', ck).focus(); return; } c.override = v; renderReview(); renderOverlay(); $(`[data-ck="${id}"] .ck-row`).focus(); renderTiles(); return; }
  if (act === 'revise') {
    S.strokes.s5 = { list: [BLOB], undo: [] };
    S.target = 's5'; S.sel = []; promptEl.value = c.revise; autosize();
    closeLayer(); setTimeout(() => { promptEl.focus(); promptEl.setSelectionRange(promptEl.value.length, promptEl.value.length); }, reduced ? 0 : 240);
    render(); return;
  }
  if (t.closest('.ck-row')) { S.openCheck = S.openCheck === id ? null : id; if (id === 'pixel' && S.openCheck) S.showArea = true; renderReview(); renderReviewTools(); $(`[data-ck="${id}"] .ck-row`).focus(); }
});
function renderReviewTools() {
  $$('#reviewTools [data-show]').forEach(b => b.setAttribute('aria-checked', String((b.dataset.show === 'source') === S.showSource)));
  $('#areaToggle').setAttribute('aria-pressed', String(S.showArea));
  figAlt.hidden = !S.showSource;
  renderOverlay(); renderReadout();
}
$('#reviewTools').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.show) S.showSource = b.dataset.show === 'source';
  if (b.id === 'areaToggle') S.showArea = !S.showArea;
  if (b.id === 'closeReview') { closeLayer(); return; }
  renderReviewTools();
});

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#styleMenu').hidden) { $('#styleMenu').hidden = true; $('#styleSwitch')?.focus(); return; }
    if (openPopState) { closePop(true); return; }
    if (S.mode !== 'board') { closeLayer(); return; }
  }
  if (S.mode !== 'edit' || e.target.matches('textarea,input[type=text]')) return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === '[' || k === ']') { const L = S.tool.layer; S.tool.size[L] = Math.max(12, Math.min(240, S.tool.size[L] + (k === ']' ? 12 : -12))); renderTools(); }
  else if (k === 'e') { S.tool.erase = true; renderTools(); }
  else if (k === 'b') { S.tool.erase = false; renderTools(); }
  else if (k === 'a') { S.tool.layer = 'area'; renderTools(); }
  else if (k === 's') { S.tool.layer = 'sketch'; renderTools(); }
});
document.addEventListener('pointerdown', () => { document.documentElement.dataset.modality = 'pointer'; }, true);
document.addEventListener('keydown', e => { if (['Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) document.documentElement.dataset.modality = 'keyboard'; }, true);

/* ---------- Import (local only: images stay in this page) ---------- */
let impN = 0;
function addFiles(files) {
  let added = 0;
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const id = 'imp' + (++impN), img = new Image();
    img.alt = ''; img.src = URL.createObjectURL(f);
    ITEMS[id] = { name: f.name.replace(/\.[^.]+$/, ''), img, col: 'B' };
    const el = makeTile(id); el.classList.add('enter');
    $('#colB').prepend(el); added++;
    img.onload = () => render();
  }
  if (added) { board.scrollTo({ left: 0, top: 0, behavior: reduced ? 'auto' : 'smooth' }); note(`Added ${added} ${added === 1 ? 'image' : 'images'} to the canvas. Nothing leaves this page.`); }
}
$('#importBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
frame.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); frame.classList.add('dropping'); } });
frame.addEventListener('dragleave', e => { if (!frame.contains(e.relatedTarget)) frame.classList.remove('dropping'); });
frame.addEventListener('drop', e => { e.preventDefault(); frame.classList.remove('dropping'); addFiles(e.dataTransfer.files); });

/* ---------- Tooltip ---------- */
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; tip.setAttribute('role', 'tooltip'); frame.append(tip);
let tipT = 0, tipFor = null;
function showTip(el) {
  clearTimeout(tipT);
  tipT = setTimeout(() => {
    if (!el.isConnected) return;
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const fr = frame.getBoundingClientRect(), r = el.getBoundingClientRect();
    let left = r.left - fr.left + r.width / 2 - tip.offsetWidth / 2;
    left = Math.max(8, Math.min(left, fr.width - tip.offsetWidth - 8));
    let top = r.top - fr.top - tip.offsetHeight - 6; if (top < 4) top = r.bottom - fr.top + 6;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }, 380);
}
function hideTip() { clearTimeout(tipT); tip.hidden = true; tipFor = null; }
frame.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && el !== tipFor) { tipFor = el; showTip(el); } else if (!el) hideTip(); });
frame.addEventListener('pointerdown', hideTip);
frame.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && document.documentElement.dataset.modality === 'keyboard') showTip(el); });
frame.addEventListener('focusout', hideTip);
frame.addEventListener('pointerleave', hideTip);

/* ---------- Render + layout ---------- */
function render() { renderTiles(); renderTray(); renderComposer(); renderFullPrompt(); }
new ResizeObserver(() => {
  frame.style.setProperty('--composer-h', composer.offsetHeight + 'px');
  placePop(); layoutFocus();
}).observe(composer);
new ResizeObserver(() => { placePop(); layoutFocus(); }).observe(frame);

/* ---------- Mockup states (simulator only) ---------- */
const NOTES = {
  board: 'Click art to attach it to the prompt. Import is top right, or drop files anywhere.',
  attached: 'Numbers match art and thumbnails. Hover either to find the other. The page icon shows the full prompt.',
  edit: 'Paint with the pointer. [ and ] resize, E erases, B paints, ⌘Z undoes, Esc finishes.',
  style: 'Open a rule to edit what it adds to the prompt and what it looks for. Edits update the full prompt.',
  review: 'Switch Result and Source above the image. Open a check to see its evidence and where it looked.',
};
let noteT = 0;
function note(t) { const n = $('#simNote'); n.textContent = t; clearTimeout(noteT); noteT = setTimeout(() => { n.textContent = NOTES[curState]; }, 4200); }
let curState = 'board';
function setState(name) {
  curState = name;
  $$('.sim [data-state]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.state === name)));
  clearTimeout(noteT); $('#simNote').textContent = NOTES[name];
  closePop(); hideTip();
  scrim.hidden = true; focusEl.hidden = true; S.mode = 'board'; cursor.hidden = true;
  Object.assign(S, { sel: [], active: null, target: null, strokes: {}, openRule: null, review: null, openCheck: null, showSource: false, showArea: true, showOverlay: true, limitMsg: '', showCandidate: false });
  S.kept = new Set(); S.seen = new Set();
  S.style = { name: 'Field notes', version: 3, dirty: false, enabled: true, rules: STYLE_RULES() };
  S.tool = { layer: 'area', erase: false, size: { area: 96, sketch: 10 } };
  $('#fullPrompt').hidden = true; $('#fpBtn').setAttribute('aria-expanded', 'false');
  promptEl.value = '';
  if (name === 'attached' || name === 'style') {
    S.sel = ['layout', 'walkers', 'leaves'];
    promptEl.value = 'A researcher crosses a shallow stream with a notebook. Use the layout from 1, the walkers from 2 and the leaf shapes from 3.';
  }
  if (name === 'edit') { S.sel = ['leaves']; promptEl.value = 'Replace the fine branches with two broad leaf shapes like image 2.'; }
  if (name === 'review') { S.showCandidate = true; }
  autosize(); render(); board.scrollTo(0, 0);
  requestAnimationFrame(() => {
    if (name === 'edit') openEdit('s1');
    if (name === 'style') { S.openRule = 'quiet'; renderStyle(); openPop(stylePop, $('#styleBtn')); }
    if (name === 'review') { S.active = 's5'; render(); openReview('s5'); }
  });
}
$$('.sim [data-state]').forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
renderSettings();
setState('board');
})();
</script>
</body>
